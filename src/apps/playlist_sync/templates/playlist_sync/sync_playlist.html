{% extends "base.html" %}
{% load static %}

{% block title %}Sync YouTube Playlist to Spotify{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center">Sync YouTube Playlist to Spotify</h1>
        
        <div class="bg-white shadow-lg rounded-lg p-6">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <div class="space-y-4">
                    <div>
                        <label for="youtube_playlist_url" class="block text-sm font-medium text-gray-700">
                            YouTube Playlist URL
                        </label>
                        <input type="url" name="youtube_playlist_url" id="youtube_playlist_url" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                            placeholder="https://www.youtube.com/playlist?list=...">
                    </div>

                    <div>
                        <label for="spotify_playlist_name" class="block text-sm font-medium text-gray-700">
                            Spotify Playlist Name
                        </label>
                        <input type="text" name="spotify_playlist_name" id="spotify_playlist_name" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                            placeholder="My Synced Playlist">
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" name="reverse_order" id="reverse_order"
                            class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="reverse_order" class="ml-2 block text-sm text-gray-700">
                            Reverse playlist order
                        </label>
                    </div>
                </div>

                <div class="flex justify-center">
                    <button type="submit"
                        class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Start Sync
                    </button>
                </div>
            </form>
        </div>

        {% if error %}
        <div class="mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
