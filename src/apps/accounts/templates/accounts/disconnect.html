{% extends "base.html" %}

{% block title %}Disconnect Spotify{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-gray-800 border border-gray-700 rounded-lg p-6">
        <h1 class="text-2xl font-bold mb-4">Disconnect Spotify</h1>
        <p class="text-gray-400 mb-6">This clears encrypted tokens stored for your account. You can reconnect later with the same minimum playlist scopes.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="bg-red-700 hover:bg-red-600 text-white font-medium px-4 py-2 rounded">
                Disconnect
            </button>
            <a href="{% url 'dashboard:dashboard' %}" class="ml-3 text-gray-300">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
