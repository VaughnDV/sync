{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-100">Login</h1>

        <div class="bg-gray-800 shadow-lg rounded-lg p-6 border border-gray-700">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div class="space-y-4">
                    <div>
                        <label for="id_email" class="block text-sm font-medium text-gray-300">
                            Email
                        </label>
                        <input type="email" name="email" id="id_email" required
                            class="mt-1 block w-full rounded-md border-gray-600 bg-gray-700 text-gray-100 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                            placeholder="Enter your email">
                    </div>

                    <div>
                        <label for="id_password" class="block text-sm font-medium text-gray-300">
                            Password
                        </label>
                        <input type="password" name="password" id="id_password" required
                            class="mt-1 block w-full rounded-md border-gray-600 bg-gray-700 text-gray-100 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                            placeholder="Enter your password">
                    </div>
                </div>

                <div class="flex justify-center">
                    <button type="submit"
                        class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Login
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400">
                    Don't have an account?
                    <a href="{% url 'accounts:register' %}" class="font-medium text-indigo-400 hover:text-indigo-300">
                        Register here
                    </a>
                </p>
            </div>
        </div>

        {% if form.errors %}
        <div class="mt-4 bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded">
            Your email and password didn't match. Please try again.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
