{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sync Playlist - Sync{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Sync YouTube Playlist to Spotify</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">Start Sync</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
