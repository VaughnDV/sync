<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sync{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-900 min-h-screen text-gray-200">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="{% url 'dashboard:dashboard' %}" class="text-2xl font-bold text-indigo-400">Sync</a>
                    </div>
                </div>
                <div class="flex items-center">
                    {% if user.is_authenticated %}
                        <a href="{% url 'dashboard:dashboard' %}" 
                           class="text-gray-300 hover:text-indigo-400 px-3 py-2 rounded-md text-sm font-medium">
                            Dashboard
                        </a>
                        <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-gray-300 hover:text-indigo-400 px-3 py-2 rounded-md text-sm font-medium">
                                Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'accounts:login' %}" 
                           class="text-gray-300 hover:text-indigo-400 px-3 py-2 rounded-md text-sm font-medium">
                            Login
                        </a>
                        <a href="{% url 'accounts:register' %}" 
                           class="bg-indigo-600 text-white hover:bg-indigo-500 ml-3 px-4 py-2 rounded-md text-sm font-medium">
                            Register
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main>
        {% if messages %}
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
                {% for message in messages %}
                    <div class="rounded-md p-4 mb-4
                        {% if message.tags == 'success' %}
                            bg-green-900 text-green-200 border border-green-700
                        {% elif message.tags == 'error' %}
                            bg-red-900 text-red-200 border border-red-700
                        {% elif message.tags == 'warning' %}
                            bg-yellow-900 text-yellow-200 border border-yellow-700
                        {% else %}
                            bg-blue-900 text-blue-200 border border-blue-700
                        {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
