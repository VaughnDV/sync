version: '3.8'

services:
  web:
    build: .
    command: uvicorn src.sync.asgi:application --host 0.0.0.0 --port 8000 --log-level debug --lifespan off --timeout-keep-alive 300
    volumes:
      - .:/app
    expose:
      - 8000
    depends_on:
      - redis
      - db
    env_file:
      - .env

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery:
    build: .
    command: celery -A src.sync worker -l INFO
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
      - db
    env_file:
      - .env

  celery-beat:
    build: .
    command: celery -A src.sync beat -l INFO
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
      - db
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/src/static
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
