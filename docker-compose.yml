version: '3.8'

services:
  web:
    build: .
    volumes:
      - .:/app
      - .env:/app/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./app/static:/app/static
    depends_on:
      - web
    networks:
      - app_network
    restart: unless-stopped


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge 