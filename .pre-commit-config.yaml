repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: >-
          poetry run mypy src/core src/providers
          src/apps/playlist_sync/diffing.py
          src/apps/playlist_sync/matching.py
          src/apps/playlist_sync/state.py
          src/apps/playlist_sync/jobs.py
        language: system
        pass_filenames: false
        files: ^(src/core/|src/providers/|src/apps/playlist_sync/(diffing|matching|state|jobs)\.py)
