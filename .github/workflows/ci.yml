name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SYNC_TESTING: "1"
  SYNC_PROVIDER_MODE: fake
  DJANGO_SECRET_KEY: ci-secret-key
  TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  PYTHONPATH: src

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
      - run: pip install poetry==2.1.3
      - run: poetry install --no-root --no-interaction
      - run: poetry run ruff check src tests scripts
      - run: poetry run ruff format --check src tests scripts
      - run: poetry run mypy src/core src/providers src/apps/playlist_sync/diffing.py src/apps/playlist_sync/matching.py src/apps/playlist_sync/state.py src/apps/playlist_sync/jobs.py
      - run: SYNC_TESTING=1 poetry run python src/manage.py makemigrations --check --dry-run
      - run: DEBUG=false ALLOWED_HOSTS=example.com CSRF_TRUSTED_ORIGINS=https://example.com poetry run python src/manage.py check --deploy --fail-level ERROR

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - run: pip install poetry==2.1.3
      - run: poetry install --no-root --no-interaction
      - run: poetry run pytest tests/unit tests/failure tests/integration --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync
      REDIS_HOST: 127.0.0.1
      RABBITMQ_HOST: 127.0.0.1
      DJANGO_SETTINGS_MODULE: tests.settings_postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install poetry==2.1.3
      - run: poetry install --no-root --no-interaction
      - run: poetry run pytest tests/integration tests/failure/test_duplicate_delivery.py --no-cov

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install poetry==2.1.3
      - run: poetry install --no-root --no-interaction
      - run: poetry run pip-audit
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --no-git --redact --config /repo/.gitleaks.toml
      - name: Filesystem vulnerability scan
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.62.1 fs --severity HIGH,CRITICAL --ignore-unfixed /repo

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install poetry==2.1.3
      - run: poetry install --no-root --no-interaction
      - run: poetry run python scripts/demo.py
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build web
