[tool.poetry]
name = "sync"
version = "0.1.0"
description = "Convert YouTube playlists into reviewable Spotify playlists"
authors = ["VaughnDV <vaughndevilliers@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VaughnDV/sync"
repository = "https://github.com/VaughnDV/sync"
documentation = "https://github.com/VaughnDV/sync#readme"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
django = ">=5.2.12,<6.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.0"
social-auth-app-django = "^5.4.0"
google-api-python-client = "^2.118.0"
spotipy = "^2.25.0"
openai = "^1.76.0"
celery = "^5.5.0"
redis = "^5.2.0"
django-crispy-forms = "^2.3"
crispy-bootstrap5 = "^2025.4"
requests = "^2.32.0"
uvicorn = "^0.34.0"
dj-database-url = "^2.3.0"
pydantic = "^2.11.0"
pydantic-settings = "^2.10.0"
cryptography = "^45.0.0"
structlog = "^25.4.0"
prometheus-client = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-django = "^4.11.0"
pytest-cov = "^6.0.0"
ruff = "^0.11.0"
mypy = "^2.3.0"
django-stubs = "^5.2.0"
pip-audit = "^2.8.0"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src --cov-report=term-missing --cov-fail-under=60"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/manage.py", "src/sync/wsgi.py", "src/sync/asgi.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "DJ"]
ignore = ["DJ001", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/apps/*/migrations/*.py" = ["E501", "N"]
"tests/**" = ["B017"]
"scripts/**" = ["E402", "N806"]
"src/apps/playlist_sync/forms.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_ignores = true
explicit_package_bases = true
exclude = ["src/apps/.*/migrations/"]

[[tool.mypy.overrides]]
module = ["social_django.*", "social_core.*", "spotipy.*", "googleapiclient.*", "httplib2.*", "celery.*", "crispy_forms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "providers.spotify",
    "providers.youtube",
    "providers.classifier",
    "providers.fakes",
    "providers.factory",
    "apps.*",
    "sync.settings",
    "sync.config",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "sync.settings"
