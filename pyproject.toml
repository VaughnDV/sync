[tool.poetry]
name = "sync"
version = "0.1.0"
description = "A web app for syncing YouTube playlists with Spotify"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.0"
social-auth-app-django = "^5.4.0"
google-api-python-client = "^2.118.0"
spotipy = "^2.23.0"
openai = "^1.12.0"
celery = "^5.3.6"
redis = "^5.0.1"
crispy-forms = "^2.1"
crispy-bootstrap5 = "^2024.2"
httpx = "0.26.0"
httpcore = "1.0.2"
requests = "^2.31.0"
python-social-auth = "^0.3.6"
django-crispy-forms = "^2.1"
uvicorn = "^0.27.1"
asgiref = "^3.7.2"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
flake8 = "^7.0.0"
pytest = "^8.0.0"
pytest-django = "^4.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 