upstream django {
    server web:8000;
}

# HTTP server for initial ACME challenge
server {
    listen 80;
    server_name rpi.vaughndv.com;

    # For ACME challenge - this must come before the location / block
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (will be enabled after certificates are obtained)
server {
    listen 443 ssl;
    server_name rpi.vaughndv.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/rpi.vaughndv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpi.vaughndv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # For ACME challenge - this must come before the location / block
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
} 